<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Project screenshot placeholder, light theme</title>
  <desc id="desc">Warm washi-paper artwork marking where a real project screenshot can be added.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8f5ed"/>
      <stop offset="1" stop-color="#e9e0d5"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop stop-color="#d7a0ad" stop-opacity=".34"/>
      <stop offset="1" stop-color="#d7a0ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <circle cx="210" cy="104" r="235" fill="url(#bloom)"/>
  <circle cx="1044" cy="580" r="250" fill="url(#bloom)"/>
  <path d="M0 512c206-98 356-42 534 12s403 57 666-61v212H0z" fill="#d7a0ad" opacity=".13"/>
  <rect x="130" y="105" width="940" height="465" rx="24" fill="#fbf9f4" fill-opacity=".72" stroke="#b9828e" stroke-opacity=".42" stroke-width="2"/>
  <path d="M130 179h940" stroke="#b9828e" stroke-opacity=".32" stroke-width="2"/>
  <circle cx="172" cy="143" r="8" fill="#b9828e" opacity=".66"/>
  <circle cx="202" cy="143" r="8" fill="#b9828e" opacity=".38"/>
  <circle cx="232" cy="143" r="8" fill="#b9828e" opacity=".22"/>
  <g fill="#9b6572" text-anchor="middle" font-family="Georgia, 'Noto Serif JP', serif">
    <text x="600" y="337" font-size="42" letter-spacing="8">PROJECT IMAGE</text>
    <text x="600" y="390" font-size="25">Add your real project screenshot</text>
    <text x="600" y="448" font-size="22" opacity=".8">作品の画像</text>
  </g>
  <path d="M553 490c17-14 31-14 48 0m0 0c17-14 31-14 48 0" fill="none" stroke="#b9828e" stroke-width="2" opacity=".7"/>
</svg>
